<style>
  :root {
    --cm-green: #01B183;
    --cm-violet: #442B7D;
    --cm-blue: #254690;
    --cm-teal: #48CFCB;
    --cm-purple: #6740C2;
    --cm-gray: #F5F5F5;
    --cm-ink: #16162A;
    --cm-ink-soft: #4A4A63;
    --cm-line: #E4E4EA;
    --gradient: linear-gradient(95deg, #01B183 0%, #254690 55%, #442B7D 100%);
    --shadow-sm: 0 1px 2px rgba(20,12,40,0.04), 0 2px 8px rgba(20,12,40,0.04);
    --shadow-md: 0 6px 20px rgba(20,12,40,0.06), 0 1px 3px rgba(20,12,40,0.05);
    --shadow-brand: 0 8px 28px rgba(68,43,125,0.18);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);

    /* Status palette — kept hue-distinct, all soft & on-brand */
    --st-prep-bg: #EEEAF6;
    --st-prep-fg: #6740C2;
    --st-active-bg: #DAF5EC;
    --st-active-fg: #01875F;
    --st-lab-bg: #DAF3F2;
    --st-lab-fg: #0E8C88;
    --st-write-bg: #E4DEF1;
    --st-write-fg: #442B7D;
    --st-submit-grad: linear-gradient(95deg, #01B183, #254690 60%, #442B7D);
    --st-submit-fg: #fff;
    --st-deploy-bg: #C9EEDF;
    --st-deploy-fg: #016749;
    --st-validate-bg: #FFE0E9;
    --st-validate-fg: #B0306E;
    --st-gate-bg: #FFE7C9;
    --st-gate-fg: #B36100;
    --st-grant-bg: #F1E0F4;
    --st-grant-fg: #7B2C8E;
    --st-grow-bg: #E5F4DC;
    --st-grow-fg: #3F7A1C;
    --st-pheno-bg: #DCEDF6;
    --st-pheno-fg: #1B5C82;
    --st-irb-bg: #FFF1D6;
    --st-irb-fg: #8A5A00;
    --st-enroll-bg: #DDE4F5;
    --st-enroll-fg: #2A3F8E;
    --st-live-bg: #D8F1E8;
    --st-live-fg: #017A57;
    --st-build-bg: #EFE3D6;
    --st-build-fg: #7A4A1A;

    --col-label: 320px;
    --col-q: 56px;
    --row-h: 56px;
    --row-h-group: 52px;
    --total-q: 40;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    overflow-x: hidden;
    font-family: "Lato", system-ui, sans-serif;
    color: var(--cm-ink);
    background: #FAFAFB;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  h1, h2, h3, h4 { font-family: "Poppins", sans-serif; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .mono { font-family: "JetBrains Mono", monospace; }

  /* ─────────── HERO ─────────── */
  html { scroll-behavior: smooth; }
  .hero {
    position: relative;
    width: 100%;
    z-index: 5;
    background: var(--gradient);
    color: #fff;
    padding: 18px 40px 16px;
    overflow: hidden;
  }
  .jump-today {
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border: none;
    border-radius: 999px;
    background: var(--cm-ink);
    color: #fff;
    font-family: "Poppins", sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 12px 32px rgba(15, 17, 28, 0.32);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 220ms ease, transform 220ms ease;
  }
  .jump-today.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .jump-today:hover { background: var(--cm-green); }
  .jump-today .jt-arrow { font-size: 16px; line-height: 1; }

  .hero-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    position: relative;
    z-index: 1;
  }
  .hero-logo {
    height: 60px;
    width: auto;
    display: block;
  }
  .hero-meta {
    display: flex;
    gap: 14px;
    align-items: center;
    font-family: "Poppins", sans-serif;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-weight: 600;
  }
  .hero-meta .pill {
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 999px;
    padding: 6px 14px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(6px);
  }
  .hero-title {
    margin-top: 10px;
    position: relative;
    z-index: 1;
    display: flex;
    align-items: baseline;
    gap: 22px;
    flex-wrap: wrap;
  }
  .hero-h1 {
    font-size: 56px;
    line-height: 1;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .hero-sublabel {
    font-family: "Poppins", sans-serif;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    font-weight: 600;
    opacity: 0.85;
    padding-bottom: 6px;
  }
  .hero-graphic {
    flex-basis: 100%;
    margin-top: 4px;
    margin-bottom: 0;
    display: flex;
    align-items: center;
  }
  .hero-graphic svg { display: block; max-width: 1200px; width: 100%; height: auto; }
  .hero-graphic a { cursor: pointer; }
  .hero-graphic a rect { transition: filter .15s ease; }
  .hero-graphic a:hover rect { filter: brightness(1.25); }
  .hero-count {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 8px 18px;
    border: 1px solid rgba(255,255,255,0.32);
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(6px);
  }
  .hero-count .num {
    font-family: "Poppins", sans-serif;
    font-weight: 800;
    font-size: 28px;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .hero-count .lbl {
    font-family: "Poppins", sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-weight: 600;
    opacity: 0.88;
  }
  /* ─────────── PAGE BODY ─────────── */
  .page {
    padding: 8px 24px 64px;
    margin-top: 0;
  }
  .panel {
    background: #fff;
    border-radius: 24px;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--cm-line);
  }

  /* ─────────── LEGEND ─────────── */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    padding: 20px 28px;
    align-items: center;
    border-bottom: 1px solid var(--cm-line);
    background: #fff;
    position: sticky;
    top: 0;
    z-index: 6;
    box-sizing: border-box;
  }
  .legend-label {
    font-family: "Poppins", sans-serif;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--cm-ink-soft);
    margin-right: 6px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 26px;
    padding: 0 12px;
    border-radius: 999px;
    font-family: "Poppins", sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 999px; background: currentColor; }
  .chip-prep   { background: var(--st-prep-bg);   color: var(--st-prep-fg); }
  .chip-active { background: var(--st-active-bg); color: var(--st-active-fg); }
  .chip-lab    { background: var(--st-lab-bg);    color: var(--st-lab-fg); }
  .chip-write  { background: var(--st-write-bg);  color: var(--st-write-fg); }
  .chip-submit { background: var(--st-submit-grad); color: #fff; }
  .chip-deploy { background: var(--st-deploy-bg); color: var(--st-deploy-fg); }
  .chip-validate { background: var(--st-validate-bg); color: var(--st-validate-fg); }
  .chip-gate   { background: var(--st-gate-bg);   color: var(--st-gate-fg); }
  .chip-grant  { background: var(--st-grant-bg);  color: var(--st-grant-fg); }
  .chip-irb    { background: var(--st-irb-bg);    color: var(--st-irb-fg); }

  /* ─────────── GANTT ─────────── */
  .gantt-wrap {
    background: #fff;
    overflow-x: auto;
    overflow-y: visible;
    -webkit-overflow-scrolling: touch;
  }
  .gantt {
    min-width: calc(var(--col-label) + var(--total-q) * var(--col-q));
    position: relative;
  }
  .timeline-head {
    position: relative;
    z-index: 5;
    background: #fff;
    border-bottom: 1px solid var(--cm-line);
  }
  .timeline-years, .timeline-quarters {
    display: grid;
    grid-template-columns: var(--col-label) repeat(40, var(--col-q));
  }
  .timeline-years .yr {
    grid-row: 1;
    font-family: "Poppins", sans-serif;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--cm-violet);
    padding: 14px 12px 6px;
    text-align: center;
    border-right: 1px solid var(--cm-line);
  }
  .timeline-years .yr.first { border-left: 1px solid var(--cm-line); }
  .timeline-years .label-cell {
    padding: 14px 24px 6px;
    font-family: "Poppins", sans-serif;
    position: sticky;
    left: 0;
    background: #fff;
    z-index: 2;
  }
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--cm-ink-soft);
    font-weight: 600;
  }
  .timeline-quarters .q {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--cm-ink-soft);
    text-align: center;
    padding: 4px 0 12px;
    border-right: 1px solid var(--cm-line);
  }
  .timeline-quarters .q.first-of-year { border-left: 1px solid var(--cm-line); }
  .timeline-quarters .label-cell { padding: 4px 24px 12px; position: sticky; left: 0; background: #fff; z-index: 2; }

  /* Group header */
  .group {
    display: grid;
    grid-template-columns: var(--col-label) 1fr;
    align-items: center;
    height: var(--row-h-group);
    border-bottom: 1px solid var(--cm-line);
  }
  .group-label {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 24px;
    height: 100%;
    border-right: 1px solid var(--cm-line);
    position: sticky;
    left: 0;
    background: #fff;
    z-index: 2;
  }
  .group-bar {
    width: 4px;
    height: 22px;
    border-radius: 2px;
  }
  .group-name {
    font-family: "Poppins", sans-serif;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--cm-ink);
  }
  .group-tag {
    margin-left: auto;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--cm-ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .group-rail {
    height: 100%;
    background-image: linear-gradient(to right, var(--cm-line) 1px, transparent 1px);
    background-size: var(--col-q) 100%;
    background-position: 0 0;
  }

  /* Task row */
  .row {
    display: grid;
    grid-template-columns: var(--col-label) 1fr;
    height: var(--row-h);
    border-bottom: 1px solid #F1F1F4;
    transition: background 220ms var(--ease);
  }
  .row:hover { background: #FBFAFC; }
  .row-label {
    display: flex;
    align-items: center;
    position: sticky;
    left: 0;
    background: #fff;
    z-index: 2;
    gap: 12px;
    padding: 0 24px;
    border-right: 1px solid var(--cm-line);
    height: 100%;
    overflow: hidden;
  }
  .row-id {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--cm-violet);
    background: #F1EDF8;
    padding: 3px 8px;
    border-radius: 6px;
    flex-shrink: 0;
    letter-spacing: 0.02em;
  }
  .row-name {
    font-family: "Lato", sans-serif;
    font-size: 12.5px;
    line-height: 1.32;
    color: var(--cm-ink);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .row-name .muted { color: var(--cm-ink-soft); font-size: 11.5px; display: block; }
  .row-track {
    position: relative;
    height: 100%;
    background-image:
      linear-gradient(to right, #F1F1F4 1px, transparent 1px),
      linear-gradient(to right, transparent calc(var(--col-q) * 4 - 1px), rgba(68,43,125,0.06) calc(var(--col-q) * 4 - 1px), rgba(68,43,125,0.06) calc(var(--col-q) * 4));
    background-size: var(--col-q) 100%, calc(var(--col-q) * 4) 100%;
    background-position: 0 0, 0 0;
  }

  /* Bars */
  .bar {
    position: absolute;
    top: 8px;
    bottom: 8px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    font-family: "Poppins", sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: transform 140ms var(--ease), filter 140ms var(--ease), box-shadow 140ms var(--ease);
    cursor: default;
    overflow: hidden;
    white-space: nowrap;
    z-index: 1;
  }
  .bar:hover {
    transform: translateY(-1px);
    filter: brightness(1.04);
    box-shadow: var(--shadow-sm);
    z-index: 2;
  }
  .bar.prep   { background: var(--st-prep-bg);   color: var(--st-prep-fg); }
  .bar.active { background: var(--st-active-bg); color: var(--st-active-fg); }
  .bar.lab    { background: var(--st-lab-bg);    color: var(--st-lab-fg); }
  .bar.write  { background: var(--st-write-bg);  color: var(--st-write-fg); }
  .bar.submit { background: var(--st-submit-grad); color: #fff; box-shadow: var(--shadow-brand); }
  .bar.deploy { background: var(--st-deploy-bg); color: var(--st-deploy-fg); }
  .bar.validate { background: var(--st-validate-bg); color: var(--st-validate-fg); }
  .bar.gate   { background: var(--st-gate-bg);   color: var(--st-gate-fg); }
  .bar.grant  { background: var(--st-grant-bg);  color: var(--st-grant-fg); }
  .bar.grow   { background: var(--st-grow-bg);   color: var(--st-grow-fg); }
  .bar.pheno  { background: var(--st-pheno-bg);  color: var(--st-pheno-fg); }
  .bar.irb    { background: var(--st-irb-bg);    color: var(--st-irb-fg); }
  .bar.enroll { background: var(--st-enroll-bg); color: var(--st-enroll-fg); }
  .bar.live   { background: var(--st-live-bg);   color: var(--st-live-fg); }
  .bar.build  { background: var(--st-build-bg);  color: var(--st-build-fg); }

  /* Publish star marker */
  .bar.submit { font-size: 9px; letter-spacing: 0.04em; padding: 0 4px; }

  /* Group accent colors */
  .grp-pan   { --grp: var(--cm-violet); background: linear-gradient(to right, rgba(68,43,125,0.05), transparent 60%); }
  .grp-gp    { --grp: var(--cm-green);  background: linear-gradient(to right, rgba(1,177,131,0.06), transparent 60%); }
  .grp-spin  { --grp: var(--cm-purple); background: linear-gradient(to right, rgba(103,64,194,0.05), transparent 60%); }
  .grp-exp   { --grp: var(--cm-blue);   background: linear-gradient(to right, rgba(37,70,144,0.05), transparent 60%); }
  .grp-epi   { --grp: var(--cm-teal);   background: linear-gradient(to right, rgba(72,207,203,0.08), transparent 60%); }
  .grp-sci   { --grp: #B36100;          background: linear-gradient(to right, rgba(179,97,0,0.05), transparent 60%); }
  .grp-cd    { --grp: var(--cm-green);  background: linear-gradient(to right, rgba(1,177,131,0.05), transparent 60%); }
  .grp-mc    { --grp: var(--cm-blue);   background: linear-gradient(to right, rgba(37,70,144,0.05), transparent 60%); }
  .grp-cfl   { --grp: var(--cm-purple); background: linear-gradient(to right, rgba(103,64,194,0.05), transparent 60%); }
  .grp-vsc   { --grp: #0E8C88;          background: linear-gradient(to right, rgba(14,140,136,0.06), transparent 60%); }
  .grp-cex   { --grp: #C4860A;          background: linear-gradient(to right, rgba(196,134,10,0.06), transparent 60%); }
  .group-bar { background: var(--grp); }

  /* Year band shading on track */
  .row-track.shade-odd::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: repeating-linear-gradient(to right,
      rgba(68,43,125,0.025) 0,
      rgba(68,43,125,0.025) calc(var(--col-q) * 4),
      transparent calc(var(--col-q) * 4),
      transparent calc(var(--col-q) * 8));
  }

  /* Today marker */
  .today {
    position: absolute;
    top: 0; bottom: 0;
    width: 0;
    border-left: 2px dashed var(--cm-green);
    z-index: 0;
    pointer-events: none;
  }
  .today-flag {
    position: absolute;
    top: -22px;
    transform: translateX(-50%);
    background: var(--cm-green);
    color: #fff;
    font-family: "Poppins", sans-serif;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* Section divider in gantt */
  .section-divider {
    height: 8px;
    background: linear-gradient(to bottom, #FAFAFB, #fff);
    border-bottom: 1px solid var(--cm-line);
  }

  /* ─────────── FOOTNOTES ─────────── */
  .notes {
    margin-top: 28px;
    padding: 28px 32px;
    background: #fff;
    border-radius: 20px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--cm-line);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  .note h4 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--cm-violet);
    margin-bottom: 10px;
    font-weight: 700;
  }
  .note p {
    margin: 0;
    font-size: 13px;
    line-height: 1.55;
    color: var(--cm-ink-soft);
  }
  .note p strong { color: var(--cm-ink); font-weight: 700; }

  .footer-meta {
    margin-top: 32px;
    padding: 20px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--cm-ink-soft);
    font-size: 12px;
    font-family: "Poppins", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 500;
  }

  @media (max-width: 1100px) {
    .hero { padding: 18px 24px 16px; }
    .hero-h1 { font-size: 40px; }
    .page { padding: 0 12px 48px; }
  }

  /* ─────────── MOBILE · TABLET (≤ 860px) ─────────── */
  @media (max-width: 860px) {
    :root {
      --col-label: 220px;
      --col-q: 50px;
      --row-h: 56px;
      --row-h-group: 48px;
    }
    .hero { padding: 14px 18px 14px; }
    .hero-row { flex-wrap: wrap; gap: 12px; }
    .hero-logo { height: 44px; }
    .hero-meta { font-size: 11px; gap: 10px; flex-wrap: wrap; }
    .hero-meta .pill { padding: 5px 11px; }
    .hero-count { padding: 6px 12px; gap: 8px; }
    .hero-count .num { font-size: 22px; }
    .hero-count .lbl { font-size: 10px; letter-spacing: 0.12em; }
    .hero-h1 { font-size: 32px; letter-spacing: -0.015em; }
    .hero-sublabel { font-size: 13px; letter-spacing: 0.16em; }
    .hero-title { gap: 14px; margin-top: 6px; }
    .hero-graphic { display: none; }
    .hero::after { width: 220px; height: 220px; right: -60px; top: -40px; }

    .page { padding: 0 8px 40px; }
    .panel { border-radius: 16px; }
    .legend { padding: 12px 16px; gap: 8px 10px; }
    .legend-label { font-size: 10px; margin-right: 2px; }
    .chip { height: 22px; padding: 0 10px; font-size: 10px; gap: 5px; }

    .group-label, .row-label { padding: 0 14px; gap: 10px; }
    .group-name { font-size: 12px; letter-spacing: 0.1em; }
    .group-tag { display: none; }
    .row-id { font-size: 10px; padding: 2px 6px; }
    .row-name { font-size: 12px; line-height: 1.3; }
    .row-name .muted { font-size: 11px; }

    .timeline-years .yr { font-size: 11px; padding: 10px 6px 4px; letter-spacing: 0.1em; }
    .timeline-years .label-cell { padding: 10px 14px 4px; }
    .timeline-quarters .q { font-size: 10px; padding: 3px 0 8px; }
    .timeline-quarters .label-cell { padding: 3px 14px 8px; }

    .bar { font-size: 9px; letter-spacing: 0.06em; padding: 0 7px; }
    .bar.submit { font-size: 9px; padding: 0 4px; }

    .jump-today {
      bottom: 18px; right: 18px;
      padding: 10px 14px;
      font-size: 11px; letter-spacing: 0.04em;
    }
  }

  /* ─────────── MOBILE · PHONE (≤ 560px) ─────────── */
  @media (max-width: 560px) {
    :root {
      --col-label: 168px;
      --col-q: 44px;
      --row-h: 60px;
      --row-h-group: 44px;
    }
    .hero { padding: 12px 14px 12px; }
    .hero-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    .hero-logo { height: 34px; }
    .hero-meta { width: 100%; }
    .hero-count .num { font-size: 18px; }
    .hero-count .lbl { font-size: 9px; }
    .hero-h1 { font-size: 26px; line-height: 1.05; }
    .hero-sublabel { font-size: 11px; letter-spacing: 0.14em; }
    .hero-title { gap: 8px; margin-top: 4px; }
    .hero::after { width: 160px; height: 160px; right: -40px; top: -30px; opacity: 0.06; }

    .page { padding: 0 0 32px; }
    .panel { border-radius: 0; border-left: 0; border-right: 0; }
    .legend {
      padding: 10px 12px;
      gap: 6px 8px;
    }
    .group-label, .row-label { padding: 0 10px; gap: 8px; }
    .row-id { font-size: 9.5px; padding: 2px 5px; }
    .row-name { font-size: 11.5px; }
    .row-name .muted { display: none; }

    .jump-today {
      bottom: 14px; right: 14px;
      padding: 9px 12px;
      font-size: 10px;
      gap: 6px;
    }
    .jump-today .jt-label { display: none; }
    .jump-today .jt-arrow { font-size: 14px; }
  }

  /* ─────────── SYNOPSIS MODAL ─────────── */
  .row.has-synopsis { cursor: pointer; }
  .row.grp-pan.has-synopsis:hover  { background: rgba(68,43,125,0.06); }
  .row.grp-gp.has-synopsis:hover   { background: rgba(1,177,131,0.07); }
  .row.grp-spin.has-synopsis:hover { background: rgba(103,64,194,0.07); }
  .row.grp-exp.has-synopsis:hover  { background: rgba(37,70,144,0.06); }
  .row.grp-epi.has-synopsis:hover  { background: rgba(72,207,203,0.10); }
  .row.grp-sci.has-synopsis:hover  { background: rgba(179,97,0,0.07); }
  .row.grp-cd.has-synopsis:hover   { background: rgba(1,177,131,0.06); }
  .row.grp-mc.has-synopsis:hover   { background: rgba(37,70,144,0.06); }
  .row.grp-cfl.has-synopsis:hover  { background: rgba(103,64,194,0.06); }
  .row.grp-vsc.has-synopsis:hover  { background: rgba(14,140,136,0.08); }
  .row.grp-cex.has-synopsis:hover  { background: rgba(196,134,10,0.08); }
  .row.has-synopsis:focus-visible {
    outline: 2px solid var(--cm-violet);
    outline-offset: -2px;
  }

  .synopsis-modal {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(15, 17, 28, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms var(--ease);
    padding: 28px 20px;
  }
  .synopsis-modal.open { opacity: 1; pointer-events: auto; }
  .synopsis-card {
    position: relative;
    background: #fff;
    border-radius: 16px;
    width: 100%;
    max-width: 720px;
    max-height: calc(100vh - 56px);
    max-height: calc(100dvh - 56px);
    overflow: hidden;
    box-shadow: var(--shadow-brand), 0 20px 60px rgba(15,17,28,0.32);
    transform: translateY(12px) scale(0.98);
    transition: transform 180ms var(--ease);
    display: flex;
    flex-direction: column;
  }
  .synopsis-modal.open .synopsis-card { transform: translateY(0) scale(1); }
  .synopsis-card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--gradient);
  }
  .synopsis-close {
    position: absolute;
    top: 14px; right: 14px;
    width: 36px; height: 36px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--cm-ink-soft);
    font-size: 20px;
    line-height: 1;
    font-family: "Poppins", sans-serif;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 140ms var(--ease), color 140ms var(--ease);
    z-index: 2;
  }
  .synopsis-close:hover, .synopsis-close:focus-visible {
    background: #F1F1F4;
    color: var(--cm-ink);
    outline: none;
  }
  .synopsis-header {
    padding: 34px 60px 20px 40px;
    border-bottom: 1px solid var(--cm-line);
    flex-shrink: 0;
  }
  .synopsis-track-tag {
    display: inline-block;
    font-family: "Poppins", sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .synopsis-track-tag.tt-pan  { background: var(--st-write-bg);    color: var(--st-write-fg); }
  .synopsis-track-tag.tt-gp   { background: var(--st-active-bg);   color: var(--st-active-fg); }
  .synopsis-track-tag.tt-spin { background: var(--st-prep-bg);     color: var(--st-prep-fg); }
  .synopsis-track-tag.tt-exp  { background: var(--st-enroll-bg);   color: var(--st-enroll-fg); }
  .synopsis-track-tag.tt-epi  { background: var(--st-lab-bg);      color: var(--st-lab-fg); }
  .synopsis-track-tag.tt-sci  { background: var(--st-gate-bg);     color: var(--st-gate-fg); }
  .synopsis-track-tag.tt-cd   { background: var(--st-grow-bg);     color: var(--st-grow-fg); }
  .synopsis-track-tag.tt-mc   { background: var(--st-validate-bg); color: var(--st-validate-fg); }
  .synopsis-track-tag.tt-cfl  { background: var(--st-lab-bg);      color: var(--st-lab-fg); }
  .synopsis-track-tag.tt-vsc  { background: var(--st-gate-bg);     color: var(--st-gate-fg); }
  .synopsis-track-tag.tt-cex  { background: var(--st-irb-bg);      color: var(--st-irb-fg); }
  .synopsis-id {
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--cm-violet);
    background: #F1EDF8;
    padding: 4px 10px;
    border-radius: 6px;
    display: inline-block;
    margin-right: 10px;
    margin-bottom: 12px;
    letter-spacing: 0.02em;
    vertical-align: middle;
  }
  .synopsis-title {
    font-family: "Poppins", sans-serif;
    font-weight: 700;
    font-size: 24px;
    line-height: 1.25;
    color: var(--cm-ink);
    letter-spacing: -0.01em;
    margin-top: 4px;
  }
  .synopsis-body {
    padding: 24px 40px 28px;
    overflow-y: auto;
    flex: 1 1 auto;
  }
  .synopsis-section { margin-bottom: 22px; }
  .synopsis-section:last-child { margin-bottom: 0; }
  .synopsis-label {
    font-family: "Poppins", sans-serif;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--cm-ink-soft);
    margin-bottom: 8px;
  }
  .synopsis-section p {
    margin: 0;
    font-family: "Lato", sans-serif;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--cm-ink);
  }
  .synopsis-section.q-section p {
    font-style: italic;
    color: var(--cm-ink);
    border-left: 3px solid var(--cm-green);
    padding-left: 14px;
  }
  .synopsis-deliverables {
    margin: 0;
    padding-left: 20px;
    list-style: disc;
  }
  .synopsis-deliverables li {
    font-family: "Lato", sans-serif;
    font-size: 14px;
    line-height: 1.55;
    color: var(--cm-ink);
    margin-bottom: 6px;
  }
  .synopsis-deliverables li::marker { color: var(--cm-violet); }
  .synopsis-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 16px 40px 22px;
    border-top: 1px solid var(--cm-line);
    flex-shrink: 0;
    background: #FAFAFB;
  }
  .synopsis-nav {
    font-family: "Poppins", sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid var(--cm-line);
    background: #fff;
    color: var(--cm-ink);
    cursor: pointer;
    transition: background 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease);
  }
  .synopsis-nav:hover:not([disabled]),
  .synopsis-nav:focus-visible:not([disabled]) {
    background: var(--cm-violet);
    border-color: var(--cm-violet);
    color: #fff;
    outline: none;
  }
  .synopsis-nav[disabled] {
    opacity: 0.32;
    pointer-events: none;
    cursor: default;
  }
  body.modal-open { overflow: hidden; }

  @media (max-width: 720px) {
    .synopsis-modal { padding: 0; align-items: stretch; }
    .synopsis-card {
      max-width: 100%;
      max-height: 100vh;
      max-height: 100dvh;
      border-radius: 0;
    }
    .synopsis-header { padding: 24px 52px 16px 22px; }
    .synopsis-body { padding: 18px 22px 22px; }
    .synopsis-footer { padding: 14px 18px 18px; }
    .synopsis-title { font-size: 20px; }
    .synopsis-nav { padding: 8px 12px; font-size: 11px; letter-spacing: 0.04em; }
  }
</style>
</head>

const gantt = document.getElementById("gantt");

// Header — years
const yearsRow = document.createElement("div");
yearsRow.className = "timeline-years";
const labelHead = document.createElement("div");
labelHead.className = "label-cell";
labelHead.textContent = "Thread / Paper";
yearsRow.appendChild(labelHead);

const yearGroups = {};
QUARTERS.forEach((q, i) => {
  yearGroups[q.y] = (yearGroups[q.y] || 0) + 1;
});
let yearsAdded = new Set();
let colCursor = 2; // col 1 = label cell
QUARTERS.forEach((q, i) => {
  if (!yearsAdded.has(q.y)) {
    const cell = document.createElement("div");
    cell.className = "yr" + (i === 0 ? " first" : "");
    const span = yearGroups[q.y];
    cell.style.gridColumn = `${colCursor} / span ${span}`;
    cell.textContent = `20${q.y}`;
    yearsRow.appendChild(cell);
    yearsAdded.add(q.y);
    colCursor += span;
  }
});

// Header — quarters
const qRow = document.createElement("div");
qRow.className = "timeline-quarters";
const labelHead2 = document.createElement("div");
labelHead2.className = "label-cell";
labelHead2.textContent = "";
qRow.appendChild(labelHead2);
QUARTERS.forEach((q, i) => {
  const cell = document.createElement("div");
  cell.className = "q" + (q.q === "Q1" || i === 0 ? " first-of-year" : "");
  cell.textContent = q.q;
  qRow.appendChild(cell);
});

const head = document.createElement("div");
head.className = "timeline-head";
head.appendChild(yearsRow);
head.appendChild(qRow);
gantt.appendChild(head);

// Today marker — May 7, 2026 → start of Q2 2026 (col 0), at ~37/91 days through Q2
// Q2 = April-June. May 7 is ~37 days into Q2. 37/91 = 0.41
const TODAY_OFFSET_QUARTERS = 0 + (37/91);

GROUPS.forEach((grp, gi) => {
  // Group header row
  const ghead = document.createElement("div");
  ghead.className = `group ${grp.className}`;
  ghead.id = `thread-${grp.id}`;
  ghead.innerHTML = `
    <div class="group-label">
      <div class="group-bar"></div>
      <div class="group-name">${grp.name}</div>
    </div>
    <div class="group-rail"></div>
  `;
  // Add tag to group label
  const tagEl = document.createElement("span");
  tagEl.className = "group-tag";
  tagEl.textContent = grp.tag;
  ghead.querySelector(".group-label").appendChild(tagEl);
  gantt.appendChild(ghead);

  // Task rows
  grp.tasks.forEach((task, ti) => {
    const row = document.createElement("div");
    row.className = `row ${grp.className}`;
    row.style.background = "transparent"; // override gradient bg from class on row level

    if (SYNOPSES[task.id]) {
      row.classList.add("has-synopsis");
      row.setAttribute("tabindex", "0");
      row.setAttribute("role", "button");
      row.setAttribute("aria-label", `Open synopsis for ${task.id}`);
      row.dataset.paperId = task.id;
      row.addEventListener("click", () => openSynopsis(task.id, row));
      row.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openSynopsis(task.id, row);
        }
      });
    }

    const label = document.createElement("div");
    label.className = "row-label";
    label.innerHTML = `
      <span class="row-id">${task.id}</span>
      <span class="row-name">${task.name}${task.subname ? `<span class="muted">${task.subname}</span>` : ""}</span>
    `;
    row.appendChild(label);

    const track = document.createElement("div");
    track.className = "row-track";

    // Bars
    task.segs.forEach(s => {
      const bar = document.createElement("div");
      bar.className = `bar ${s.status}`;
      const left = (s.start / TOTAL_Q) * 100;
      const width = ((s.end - s.start + 1) / TOTAL_Q) * 100;
      bar.style.left = `calc(${left}%)`;
      bar.style.width = `calc(${width}% - 4px)`;
      bar.style.marginLeft = "2px";
      const display = LABELS[s.status] || s.label;
      const span = s.end - s.start + 1;
      if (s.status === "submit") {
        bar.textContent = span === 1 ? "★ PUB" : "★ PUBLISH";
      } else {
        bar.textContent = span === 1 ? display.slice(0, 6) : display;
      }
      bar.title = `${task.id} · ${display} · ${QUARTERS[s.start].q} 20${QUARTERS[s.start].y}${s.end !== s.start ? ` → ${QUARTERS[s.end].q} 20${QUARTERS[s.end].y}` : ""}`;
      track.appendChild(bar);
    });

    // Today marker only on the first task row of first group
    if (gi === 0 && ti === 0) {
      const today = document.createElement("div");
      today.className = "today";
      today.style.left = `calc(${(TODAY_OFFSET_QUARTERS / TOTAL_Q) * 100}%)`;
      const flag = document.createElement("div");
      flag.className = "today-flag";
      flag.textContent = "Today · May 7, 2026";
      today.appendChild(flag);
      track.appendChild(today);
    }

    row.appendChild(track);
    gantt.appendChild(row);
  });
});

// Add a continuous vertical "today" line spanning full gantt height
// (positioned absolutely from a wrapper)
const todayFull = document.createElement("div");
todayFull.style.position = "absolute";
todayFull.style.top = "0";
todayFull.style.bottom = "0";
todayFull.style.left = `calc(var(--col-label) + (${TODAY_OFFSET_QUARTERS} * var(--col-q)))`;
todayFull.style.borderLeft = "2px dashed rgba(1,177,131,0.55)";
todayFull.style.pointerEvents = "none";
todayFull.style.zIndex = "0";
gantt.style.position = "relative";
gantt.appendChild(todayFull);

jumpBtn.innerHTML = '<span class="jt-arrow">←</span><span class="jt-label">Jump to today</span>';
document.body.appendChild(jumpBtn);

function todayDocX() {
  const cs = getComputedStyle(document.documentElement);
  const colLabel = parseFloat(cs.getPropertyValue('--col-label')) || 320;
  const colQ = parseFloat(cs.getPropertyValue('--col-q')) || 56;
  return colLabel + (TODAY_OFFSET_QUARTERS * colQ);
}
const _wrap = document.querySelector('.gantt-wrap');
function updateJumpBtn() {
  const tx = todayDocX();
  const vL = _wrap.scrollLeft, vR = _wrap.scrollLeft + _wrap.clientWidth;
  const off = tx < vL + 80 || tx > vR - 80;
  jumpBtn.classList.toggle("show", off);
  jumpBtn.querySelector(".jt-arrow").textContent = tx < vL ? "←" : (tx > vR ? "→" : "←");
}
jumpBtn.addEventListener("click", () => {
  _wrap.scrollTo({ left: Math.max(0, todayDocX() - _wrap.clientWidth * 0.28), behavior: "smooth" });
});
_wrap.addEventListener("scroll", updateJumpBtn, { passive: true });
window.addEventListener("resize", updateJumpBtn);
requestAnimationFrame(updateJumpBtn);

// ─────────── Sticky timeline-head on vertical page scroll ───────────
const _head = document.querySelector('.timeline-head');
const _gantt = document.getElementById('gantt');
if (_head) {
  _head.style.willChange = 'transform';
  _head.style.boxShadow = '0 6px 16px -10px rgba(0,0,0,0.18)';
}
function syncStickyHead() {
  if (!_head || !_gantt) return;
  const lg = document.querySelector('.legend');
  const legendBottom = lg ? lg.getBoundingClientRect().bottom : 0;
  const wrapTop = _wrap.getBoundingClientRect().top;
  const ganttRect = _gantt.getBoundingClientRect();
  const headH = _head.offsetHeight;
  // distance from natural top to legend's bottom
  let offset = legendBottom - wrapTop;
  if (offset < 0) offset = 0;
  // don't push head past the bottom of gantt
  const maxOffset = Math.max(0, ganttRect.height - headH);
  if (offset > maxOffset) offset = maxOffset;
  _head.style.transform = `translateY(${offset}px)`;
}
window.addEventListener('scroll', syncStickyHead, { passive: true });
window.addEventListener('resize', syncStickyHead);
requestAnimationFrame(syncStickyHead);

// ─────────── (hero/legend use CSS position:sticky — no JS needed) ───────────

// keep timeline-head offset in sync with sticky legend height
const _syncLegendH = () => {
  const lg = document.querySelector('.legend');
  if (lg) document.documentElement.style.setProperty('--legend-h', lg.offsetHeight + 'px');
};
_syncLegendH();
window.addEventListener('resize', _syncLegendH);

/* ──────────────── SYNOPSIS MODAL ──────────────── */

// paperId → { groupId, groupName, navList (filtered to ids with synopses) }
const PAPER_LOOKUP = (() => {
  const out = {};
  GROUPS.forEach(grp => {
    const navList = grp.tasks.map(t => t.id).filter(id => SYNOPSES[id]);
    grp.tasks.forEach(t => {
      out[t.id] = { groupId: grp.id, groupName: grp.name, navList };
    });
  });
  return out;
})();

// Warn (don't throw) on missing synopses, ignoring REG (infrastructure)
GROUPS.forEach(grp => {
  grp.tasks.forEach(t => {
    if (t.id !== "REG" && !SYNOPSES[t.id]) {
      console.warn(`SYNOPSES missing entry for paper ${t.id}`);
    }
  });
});

const _modal = document.createElement("div");
_modal.className = "synopsis-modal";
_modal.setAttribute("role", "dialog");
_modal.setAttribute("aria-modal", "true");
_modal.setAttribute("aria-hidden", "true");
_modal.innerHTML = `
  <div class="synopsis-card" role="document">
    <button class="synopsis-close" type="button" aria-label="Close synopsis">×</button>
    <div class="synopsis-header">
      <span class="synopsis-track-tag"></span>
      <div><span class="synopsis-id"></span></div>
      <h2 class="synopsis-title"></h2>
    </div>
    <div class="synopsis-body">
      <section class="synopsis-section bg-section">
        <div class="synopsis-label">Background</div>
        <p></p>
      </section>
      <section class="synopsis-section q-section">
        <div class="synopsis-label">Hypothesis · Research Question</div>
        <p></p>
      </section>
      <section class="synopsis-section deliv-section">
        <div class="synopsis-label">Expected Deliverable</div>
        <ul class="synopsis-deliverables"></ul>
      </section>
    </div>
    <div class="synopsis-footer">
      <button class="synopsis-nav synopsis-nav-prev" type="button">←</button>
      <button class="synopsis-nav synopsis-nav-next" type="button">→</button>
    </div>
  </div>
`;
document.body.appendChild(_modal);

const _modalClose = _modal.querySelector(".synopsis-close");
const _modalTrackTag = _modal.querySelector(".synopsis-track-tag");
const _modalIdEl = _modal.querySelector(".synopsis-id");
const _modalTitle = _modal.querySelector(".synopsis-title");
const _modalBg = _modal.querySelector(".bg-section p");
const _modalQ = _modal.querySelector(".q-section p");
const _modalDeliv = _modal.querySelector(".synopsis-deliverables");
const _modalPrev = _modal.querySelector(".synopsis-nav-prev");
const _modalNext = _modal.querySelector(".synopsis-nav-next");
const _modalBody = _modal.querySelector(".synopsis-body");

let _currentPaperId = null;
let _returnFocusEl = null;

function openSynopsis(paperId, returnEl) {
  const data = SYNOPSES[paperId];
  if (!data) return;
  const lookup = PAPER_LOOKUP[paperId];
  const trackKey = lookup ? lookup.groupId : "pan";
  const trackName = lookup ? lookup.groupName : (TRACK_NAMES[trackKey] || "");

  _currentPaperId = paperId;
  if (returnEl) _returnFocusEl = returnEl;

  _modalTrackTag.className = `synopsis-track-tag tt-${trackKey}`;
  _modalTrackTag.textContent = trackName;
  _modalIdEl.textContent = paperId;
  _modalTitle.textContent = data.title;
  _modalBg.textContent = data.background;
  _modalQ.textContent = data.question;
  _modalDeliv.innerHTML = "";
  data.deliverables.forEach(d => {
    const li = document.createElement("li");
    li.textContent = d;
    _modalDeliv.appendChild(li);
  });

  updateModalNav();

  _modal.classList.add("open");
  _modal.setAttribute("aria-hidden", "false");
  document.body.classList.add("modal-open");
  _modalBody.scrollTop = 0;

  setTimeout(() => _modalClose.focus(), 30);
}

function closeSynopsis() {
  if (!_modal.classList.contains("open")) return;
  _modal.classList.remove("open");
  _modal.setAttribute("aria-hidden", "true");
  document.body.classList.remove("modal-open");
  if (_returnFocusEl && document.contains(_returnFocusEl)) {
    _returnFocusEl.focus();
  }
  _currentPaperId = null;
}

function updateModalNav() {
  const lookup = PAPER_LOOKUP[_currentPaperId];
  if (!lookup) {
    _modalPrev.disabled = true;
    _modalNext.disabled = true;
    _modalPrev.textContent = "←";
    _modalNext.textContent = "→";
    return;
  }
  const list = lookup.navList;
  const idx = list.indexOf(_currentPaperId);
  const prevId = idx > 0 ? list[idx - 1] : null;
  const nextId = idx >= 0 && idx < list.length - 1 ? list[idx + 1] : null;

  if (prevId) {
    _modalPrev.disabled = false;
    _modalPrev.textContent = `← ${prevId}`;
  } else {
    _modalPrev.disabled = true;
    _modalPrev.textContent = "←";
  }
  if (nextId) {
    _modalNext.disabled = false;
    _modalNext.textContent = `${nextId} →`;
  } else {
    _modalNext.disabled = true;
    _modalNext.textContent = "→";
  }
}

function navSynopsis(direction) {
  const lookup = PAPER_LOOKUP[_currentPaperId];
  if (!lookup) return;
  const list = lookup.navList;
  const idx = list.indexOf(_currentPaperId);
  const target = direction === "prev"
    ? (idx > 0 ? list[idx - 1] : null)
    : (idx >= 0 && idx < list.length - 1 ? list[idx + 1] : null);
  if (!target) return;
  const row = document.querySelector(`.row[data-paper-id="${target}"]`);
  openSynopsis(target, row || _returnFocusEl);
}

_modalClose.addEventListener("click", closeSynopsis);
_modal.addEventListener("click", (e) => {
  if (e.target === _modal) closeSynopsis();
});
_modalPrev.addEventListener("click", () => navSynopsis("prev"));
_modalNext.addEventListener("click", () => navSynopsis("next"));

document.addEventListener("keydown", (e) => {
  if (!_modal.classList.contains("open")) return;
  if (e.key === "Escape") {
    e.preventDefault();
    closeSynopsis();
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    navSynopsis("prev");
  } else if (e.key === "ArrowRight") {
    e.preventDefault();
    navSynopsis("next");
  } else if (e.key === "Tab") {
    const focusables = [_modalClose, _modalPrev, _modalNext].filter(el => !el.disabled);
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }
});
</script>

</body>
</html>
